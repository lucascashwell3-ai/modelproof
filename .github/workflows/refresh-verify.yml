name: Modelproof verify
# v1.1 "Verify" piece (automation/PIPELINE_V1.md "Modelproof refresh — v1.1"). Confirms the
# Collect + Judge pieces actually published: live data/models.json on Pages must show the
# collect receipt's date, and the gate must pass on the live file. Uses scripts/verify-live.mjs
# (shared with auto-refresh.yml) so a Pages deploy that's merely slow — not broken — is never
# treated as a failed publish: it polls up to 30 min and only reverts on an actual failed or
# wrong deploy, never on a still-pending one. On a real failure it reverts the data commit(s)
# made since Collect ran and pushes, then fails loud.
on:
  schedule:
    - cron: "15 7 * * 2,5"   # Tue/Fri 07:15 UTC — 75 min after Collect, well past the Judge window
  workflow_dispatch: {}

permissions:
  contents: write
  actions: read

concurrency:
  group: modelproof-verify
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Wait for Pages deploy, then check as_of + gate
        # scripts/verify-live.mjs polls (up to 30 min) rather than checking once, and tells a
        # merely-slow Pages deploy apart from an actually broken one. want = the collect
        # receipt's date (falls back to today if the receipt is missing, as before); sha = HEAD,
        # i.e. whatever Collect (+ Judge) last pushed to main. Four outcomes -> three results:
        #   exit 0                -> RESULT=ok (still runs the schema/gate check below)
        #   exit 2 or 3           -> RESULT=revert (deploy failed, or deployed but wrong)
        #   exit 4 (still pending)-> RESULT=timeout (fail loud, but main is left alone)
        #   anything else         -> RESULT=revert (fail safe: unexpected is treated as broken)
        id: check
        run: |
          set +e
          url="https://lucascashwell3-ai.github.io/modelproof/data/models.json"
          collect_date=$(python3 -c "import json;print(json.load(open('data/refresh/receipt-collect.json'))['ran_at'][:10])" 2>/dev/null || date -u +%Y-%m-%d)
          echo "collect receipt date (want) = $collect_date"

          GH_TOKEN="${{ github.token }}" node scripts/verify-live.mjs \
            --want "$collect_date" \
            --sha "$(git rev-parse HEAD)" \
            --repo "$GITHUB_REPOSITORY" \
            --url "$url"
          vcode=$?
          echo "verify-live.mjs exit code: $vcode"

          if [ "$vcode" = "0" ]; then
            result="ok"
            curl -fsS "$url" -o /tmp/live-models.json
            cp /tmp/live-models.json data/models.json
            node scripts/validate-data.mjs || result="revert"
          elif [ "$vcode" = "4" ]; then
            result="timeout"
          else
            result="revert"
          fi

          echo "RESULT=$result" >> "$GITHUB_OUTPUT"
          set -e

      - name: Restore working tree (verify only reads, never keeps the live copy)
        run: git checkout -- data/models.json

      - name: Fail loud on a still-pending deploy (no revert — main may still be fine)
        if: steps.check.outputs.RESULT == 'timeout'
        run: |
          echo "::error title=modelproof verify timed out::site not updated within 30 min — data stays on main, next run re-verifies"
          exit 1

      - name: Revert on failure
        if: steps.check.outputs.RESULT == 'revert'
        run: |
          git config user.name "modelproof-verify"
          git config user.email "actions@users.noreply.github.com"
          collect_sha=$(git log --oneline -n 20 --format="%H %s" | grep -m1 "modelproof collect" | cut -d' ' -f1 || true)
          if [ -z "$collect_sha" ]; then
            echo "::error title=modelproof verify::no recent 'modelproof collect' commit found to revert — manual check needed"
            exit 1
          fi
          git revert --no-edit "${collect_sha}..HEAD" || git revert --no-edit "$collect_sha"
          ok=0
          for i in 1 2 3; do
            if git push origin HEAD:main; then ok=1; break; fi
            git pull --rebase --autostash origin main || true
            sleep 5
          done
          [ "$ok" = "1" ] || echo "::error title=modelproof verify revert push failed::manual revert needed"
          echo "::error title=modelproof verify failed::live data did not verify — reverted commit(s) since collect"
          exit 1

      - name: Write receipt
        if: always()
        run: |
          node -e "
            const fs = require('fs');
            const result = process.env.RESULT || 'unknown';
            const ok = result === 'ok';
            const errors = { revert: 'live as_of/gate check failed', timeout: 'site not updated within 30 min (not reverted)', unknown: 'verify step did not report a result' };
            fs.mkdirSync('data/refresh', { recursive: true });
            fs.writeFileSync('data/refresh/receipt-verify.json', JSON.stringify({
              job: 'verify', ran_at: new Date().toISOString(), ok, ...(ok ? {} : { error: errors[result] || errors.unknown }),
            }, null, 2) + '\n');
          "
        env:
          RESULT: ${{ steps.check.outputs.RESULT }}

      - name: Commit verify receipt
        if: always()
        run: |
          git config user.name "modelproof-verify"
          git config user.email "actions@users.noreply.github.com"
          git add data/refresh/receipt-verify.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "modelproof verify receipt $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            if git push origin HEAD:main; then break; fi
            git pull --rebase --autostash origin main || true
            sleep 5
          done
