name: Modelproof collect (v1.1)
# v1.1 "Collect" piece (automation/PIPELINE_V1.md "Modelproof refresh — v1.1"). Auto-publishes
# price/context facts that pass the check-stage agreement + sanity rules straight to main, and
# writes data/refresh/worklist.json for the Judge cloud routine to pick up. No PR, no review
# stage for facts — only genuinely conflicting/unverifiable items go to the worklist or a GitHub
# issue. Publish is followed by a live verify against GitHub Pages; a mismatch reverts and fails
# loud. Standalone Verify piece: .github/workflows/refresh-verify.yml.
#
# Runs twice a day: 06:00 UTC (the full pass — scripts/auto-refresh.mjs's DAILY_FULL_RUN_HOUR_UTC)
# and 18:00 UTC (a cheap id-only check that exits before touching the network for anything beyond
# the OpenRouter/LiteLLM lists, unless it finds a genuinely new candidate, in which case it runs
# the full collect early).
on:
  schedule:
    - cron: "0 6,18 * * *"   # 06:00 + 18:00 UTC — see scripts/auto-refresh.mjs's early-exit for what actually runs
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: auto-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Unit test the check-stage rules
        # Runs on the frozen fixture (scripts/fixtures/), never on live data — see
        # scripts/fixtures/README.md. The live catalog is checked separately, after Collect,
        # below.
        run: node --test scripts/test-*.mjs

      - name: Run collect (feed -> check -> publish -> worklist -> report)
        id: run
        env:
          GH_TOKEN: ${{ secrets.MODELPROOF_AUTOREFRESH_TOKEN || github.token }}
        run: |
          before=$(python3 -c "import json;print(json.load(open('data/models.json'))['as_of'])")
          echo "AS_OF_BEFORE=$before" >> "$GITHUB_ENV"
          node scripts/auto-refresh.mjs

      - name: Check the refreshed live data (invariants only, never expected winners)
        # scripts/auto-refresh.mjs's own internal honesty gate (validate-data.mjs) already blocks
        # a schema-invalid refresh from writing at all; validate-data.mjs here is a second,
        # standalone run of that same gate against what's now on disk. check-live-data.mjs adds
        # the checks a schema gate can't make: decide() still runs clean for every task, every
        # shortlisted id is real, situations.json's must_not_include rules still hold, the model
        # count didn't jump or collapse, and as_of is a sane date. It never asserts which model
        # should win — a refresh that legitimately changes prices/scores/availability is expected
        # to change winners, and must not fail CI for it. Runs BEFORE "Commit and push" so a red
        # run here blocks publish, not just notifies after the fact.
        run: node scripts/validate-data.mjs && node scripts/check-live-data.mjs

      - name: Commit and push straight to main
        env:
          GH_TOKEN: ${{ secrets.MODELPROOF_AUTOREFRESH_TOKEN || github.token }}
        run: |
          git config user.name "modelproof-auto-refresh"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet data/models.json data/changelog.json data/_auto_refresh_state.json data/refresh/worklist.json data/refresh/receipt-collect.json 2>/dev/null; then
            echo "no changes — nothing to publish"
            exit 0
          fi
          git add data/models.json data/changelog.json data/_auto_refresh_state.json data/refresh/worklist.json data/refresh/receipt-collect.json 2>/dev/null || true
          git commit -m "modelproof collect $(date -u +%Y-%m-%d)"
          echo "PUBLISHED=1" >> "$GITHUB_ENV"
          ok=0
          for i in 1 2 3; do
            if git push origin HEAD:main; then ok=1; break; fi
            echo "push attempt $i rejected — rebasing on main"
            git pull --rebase --autostash origin main || true
            sleep 5
          done
          if [ "$ok" != "1" ]; then
            echo "::error title=auto-refresh push failed::data not published after 3 attempts"
            exit 1
          fi

      - name: Wait for Pages deploy, then verify as_of matches
        if: env.PUBLISHED == '1'
        run: |
          after=$(python3 -c "import json;print(json.load(open('data/models.json'))['as_of'])")
          url="https://lucascashwell3-ai.github.io/modelproof/data/models.json"
          ok=0
          for i in $(seq 1 30); do
            live=$(curl -fsS "$url" | python3 -c "import json,sys;print(json.load(sys.stdin)['as_of'])" 2>/dev/null || echo "-1")
            if [ "$live" = "$after" ]; then ok=1; break; fi
            echo "attempt $i: live as_of=$live want=$after — waiting for Pages"
            sleep 10
          done
          if [ "$ok" != "1" ]; then
            echo "::error title=auto-refresh verify failed::live as_of never matched (before=$AS_OF_BEFORE after=$after) — reverting"
            git config user.name "modelproof-auto-refresh"
            git config user.email "actions@users.noreply.github.com"
            git revert --no-edit HEAD
            ok2=0
            for i in 1 2 3; do
              if git push origin HEAD:main; then ok2=1; break; fi
              git pull --rebase --autostash origin main || true
              sleep 5
            done
            [ "$ok2" = "1" ] || echo "::error title=auto-refresh revert push failed::manual revert needed"
            exit 1
          fi
          echo "verified: live as_of = $after"
