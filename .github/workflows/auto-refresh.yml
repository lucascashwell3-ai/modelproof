name: Modelproof collect (v1.1)
# v1.1 "Collect" piece (automation/PIPELINE_V1.md "Modelproof refresh — v1.1"). Auto-publishes
# price/context facts that pass the check-stage agreement + sanity rules straight to main, and
# writes data/refresh/worklist.json for the Judge cloud routine to pick up. No PR, no review
# stage for facts — only genuinely conflicting/unverifiable items go to the worklist or a GitHub
# issue. Publish is followed by a live verify against GitHub Pages; a mismatch reverts and fails
# loud. Standalone Verify piece: .github/workflows/refresh-verify.yml.
#
# Runs twice a day (cron 06:00 + 18:00 UTC; GitHub starts scheduled runs hours late). Each run
# first does a cheap id-only check. It runs the full pass (prices, availability, usage, receipt,
# as_of stamp) when the last successful full pass is 20 h or more ago or a genuinely new candidate
# id appeared (scripts/auto-refresh.mjs FULL_PASS_MIN_HOURS / decideRefreshRun); otherwise it
# exits before touching the network for anything beyond the OpenRouter/LiteLLM lists.
#
# Remote writes, and the guard that stops each one off main:
#   held-items issue  (inside "Run collect")  live branch of the shell if only, and
#                     scripts/lib/gh-issue.mjs refuses on DRY_RUN=true or a non-main ref
#   commit + push     if: env.DRY_RUN != 'true' && github.ref == 'refs/heads/main'
#   verify / revert   if: env.DRY_RUN != 'true' && github.ref == 'refs/heads/main' && env.PUBLISHED == '1'
# The full source-quote sweep (check-sources) and the claim-rot issue are not run here: a page
# that changed wording is not something Collect caused or can fix. The weekly defaults watch runs
# them. Plan lines (check-live-data --group plans) are checked by tests.yml, not here — Collect
# never writes a deprecation.
on:
  schedule:
    - cron: "0 6,18 * * *"   # 06:00 + 18:00 UTC — see scripts/auto-refresh.mjs's early-exit for what actually runs
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run everything except the push and the live-site verify"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  actions: read

concurrency:
  group: auto-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # A branch dispatch is always a dry run — a bot must never push code to main. Only a
    # workflow_dispatch on main with dry_run left false (or the schedule trigger, which always
    # fires on main) is a live run.
    env:
      DRY_RUN: ${{ inputs.dry_run == true || github.ref != 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Unit test the check-stage rules
        # Runs on the frozen fixture (scripts/fixtures/), never on live data — see
        # scripts/fixtures/README.md. The live catalog is checked separately, after Collect,
        # below.
        run: node --test scripts/test-*.mjs

      - name: Run collect (feed -> check -> publish -> worklist -> report)
        id: run
        run: |
          before=$(python3 -c "import json;print(json.load(open('data/models.json'))['as_of'])")
          echo "AS_OF_BEFORE=$before" >> "$GITHUB_ENV"
          if [ "$DRY_RUN" = "true" ]; then
            # Force the full pipeline so a branch run exercises the real feeds, not the cheap
            # id-only early exit. No GH_TOKEN: auto-refresh.mjs's reportIssue() skips writing
            # (needs both GH_TOKEN/GITHUB_TOKEN and GITHUB_REPOSITORY) when the token is missing,
            # so a dry run touches nothing remote beyond the read-only feed fetches.
            echo "dry run: REFRESH_FORCE_FULL=1, no GH_TOKEN — issue-writing stays skipped"
            REFRESH_FORCE_FULL=1 node scripts/auto-refresh.mjs
          else
            GH_TOKEN="${{ secrets.MODELPROOF_AUTOREFRESH_TOKEN || github.token }}" node scripts/auto-refresh.mjs
          fi

      - name: Check the refreshed live data (invariants only, never expected values)
        # scripts/auto-refresh.mjs's own internal honesty gate (validate-data.mjs) already blocks
        # a schema-invalid refresh from writing at all; validate-data.mjs here is a second,
        # standalone run of that same gate against what's now on disk. check-live-data.mjs
        # --group feed adds the checks a schema gate can't make: the model count didn't jump or
        # collapse, no key feed silently went empty, as_of is a sane date, every timeline entry
        # has a source, every ladder point has a publisher and a method. It never asserts expected
        # values — a refresh that legitimately changes prices or availability must not fail CI.
        # Only the feed group: the plans group judges guidance lines Collect never writes.
        # Runs BEFORE "Commit and push" so a red run here blocks publish, not just notifies after
        # the fact.
        run: node scripts/validate-data.mjs && node scripts/check-live-data.mjs --group feed

      - name: Dry-run summary (no push, no live verify)
        if: env.DRY_RUN == 'true'
        run: |
          after=$(python3 -c "import json;print(json.load(open('data/models.json'))['as_of'])")
          n=$(git diff --name-only data/ | wc -l | tr -d ' ')
          echo "as_of: $AS_OF_BEFORE -> $after"
          git diff --stat data/ || true
          {
            echo "### DRY RUN — gates passed, $n data file(s) would change, nothing pushed"
            echo ""
            echo "as_of: $AS_OF_BEFORE -> $after"
            echo ""
            echo '```'
            git diff --stat data/ || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and push straight to main
        # Belt-and-suspenders on top of DRY_RUN (which already folds in this same ref check):
        # this step must only ever run on main, full stop — a bot must never push code to a branch.
        if: env.DRY_RUN != 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.MODELPROOF_AUTOREFRESH_TOKEN || github.token }}
        run: |
          git config user.name "modelproof-auto-refresh"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet data/models.json data/changelog.json data/_auto_refresh_state.json data/refresh/worklist.json data/refresh/receipt-collect.json docs/standings-unmapped.md 2>/dev/null; then
            echo "no changes — nothing to publish"
            exit 0
          fi
          git add data/models.json data/changelog.json data/_auto_refresh_state.json data/refresh/worklist.json data/refresh/receipt-collect.json docs/standings-unmapped.md 2>/dev/null || true
          git commit -m "modelproof collect $(date -u +%Y-%m-%d)"
          echo "PUBLISHED=1" >> "$GITHUB_ENV"
          ok=0
          for i in 1 2 3; do
            if git push origin HEAD:main; then ok=1; break; fi
            echo "push attempt $i rejected — rebasing on main"
            git pull --rebase --autostash origin main || true
            sleep 5
          done
          if [ "$ok" != "1" ]; then
            echo "::error title=auto-refresh push failed::data not published after 3 attempts"
            exit 1
          fi

      - name: Wait for Pages deploy, then verify as_of matches
        # Four outcomes from scripts/verify-live.mjs (see automation/jobs/auto-refresh/README.md
        # "Failure behavior"): 0 verified, nothing else to do. 2 (deploy failed) or 3 (deployed
        # but content still wrong past the grace period) mean the publish is actually broken —
        # revert as before. 4 (still pending at 30 min) means Pages just hasn't caught up yet —
        # fail loud so it's visible, but do NOT revert; the data on main is good and the next run
        # re-verifies it. Any other exit is treated the same as 4: fail loud, never revert.
        if: env.DRY_RUN != 'true' && github.ref == 'refs/heads/main' && env.PUBLISHED == '1'
        run: |
          after=$(python3 -c "import json;print(json.load(open('data/models.json'))['as_of'])")
          set +e
          GH_TOKEN="${{ secrets.MODELPROOF_AUTOREFRESH_TOKEN || github.token }}" \
            node scripts/verify-live.mjs \
              --want "$after" \
              --sha "$(git rev-parse HEAD)" \
              --repo "$GITHUB_REPOSITORY" \
              --url "https://lucascashwell3-ai.github.io/modelproof/data/models.json"
          code=$?
          set -e
          if [ "$code" = "0" ]; then
            echo "verified: live as_of = $after"
            exit 0
          fi
          if [ "$code" = "4" ]; then
            echo "::error title=auto-refresh verify timed out::site not updated within 30 min — data stays on main, next run re-verifies"
            exit 1
          fi
          if [ "$code" = "2" ] || [ "$code" = "3" ]; then
            reason="deploy failed"
            [ "$code" = "3" ] && reason="deployed but content still wrong"
            echo "::error title=auto-refresh verify failed::$reason (before=$AS_OF_BEFORE after=$after) — reverting"
            git config user.name "modelproof-auto-refresh"
            git config user.email "actions@users.noreply.github.com"
            git revert --no-edit HEAD
            ok2=0
            for i in 1 2 3; do
              if git push origin HEAD:main; then ok2=1; break; fi
              git pull --rebase --autostash origin main || true
              sleep 5
            done
            [ "$ok2" = "1" ] || echo "::error title=auto-refresh revert push failed::manual revert needed"
            exit 1
          fi
          echo "::error title=auto-refresh verify failed::verify-live.mjs exited $code (unexpected) — not reverting"
          exit 1
